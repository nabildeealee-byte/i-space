<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:fixed;inset:0;z-index:900;background:rgba(16,16,16,.96);display:flex;flex-direction:column;gap:14px;padding:20px 26px 22px;color:#fff;font-family:var(--font-body)">
  <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.22);padding-bottom:12px;flex:none">
    <div onClick="{{ onClose }}" style="cursor:pointer;display:flex;align-items:center;gap:9px;border:2px solid rgba(255,255,255,.55);padding:8px 14px" style-hover="border-color:#ffffff"><svg viewBox="0 0 14 14" width="11" height="11"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="2" fill="none"></path></svg><span style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;font-weight:600">Close</span></div>
    <div style="text-align:right">
      <div style="font-family:var(--font-heading);font-weight:700;font-size:18px;line-height:1.1">{{ groupName }}</div>
      <div style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;opacity:.6;margin-top:3px">{{ caption }} · {{ counter }}</div>
    </div>
  </div>
  <div onPointerDown="{{ down }}" onPointerUp="{{ up }}" style="flex:1;position:relative;overflow:hidden;min-height:0;touch-action:pan-y;user-select:none">
    <div style="display:flex;height:100%;width:{{ stripW }};transition:transform .35s cubic-bezier(.4,0,.2,1);transform:{{ shift }}">
      <sc-for list="{{ slides }}" as="s" hint-placeholder-count="1">
        <div style="height:100%;position:relative;flex:0 0 {{ s.w }}"><div style="position:absolute;inset:0 10px;background-image:{{ s.bg }};background-size:contain;background-position:center;background-repeat:no-repeat"></div></div>
      </sc-for>
    </div>
    <div onClick="{{ prev }}" onPointerDown="{{ stop }}" style="cursor:pointer;position:absolute;left:0;top:50%;transform:translateY(-50%);width:44px;height:80px;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center" style-hover="background:rgba(0,0,0,.8)"><svg viewBox="0 0 12 12" width="16" height="16"><path d="M8 1L3 6l5 5" fill="none" stroke="#ffffff" stroke-width="2"></path></svg></div>
    <div onClick="{{ next }}" onPointerDown="{{ stop }}" style="cursor:pointer;position:absolute;right:0;top:50%;transform:translateY(-50%);width:44px;height:80px;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center" style-hover="background:rgba(0,0,0,.8)"><svg viewBox="0 0 12 12" width="16" height="16"><path d="M4 1l5 5-5 5" fill="none" stroke="#ffffff" stroke-width="2"></path></svg></div>
  </div>
  <div style="display:flex;gap:4px;flex:none">
    <sc-for list="{{ slides }}" as="s" hint-placeholder-count="1">
      <div onClick="{{ s.go }}" style="cursor:pointer;flex:1;height:4px;background:rgba(255,255,255,.22)" style-hover="background:rgba(255,255,255,.45)"><div style="height:100%;background:#ffffff;width:{{ s.dot }}"></div></div>
    </sc-for>
  </div>
  <div style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;opacity:.45;flex:none">Swipe or use the arrows · Esc or Close returns to the page</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;list&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;string[]&quot;},&quot;start&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;groupName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Front elevation&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Exterior render&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { idx: null };

  componentDidMount() {
    this._key = e => {
      if (e.key === "Escape") this.props.onClose && this.props.onClose();
      else if (e.key === "ArrowRight") this.step(1);
      else if (e.key === "ArrowLeft") this.step(-1);
    };
    window.addEventListener("keydown", this._key);
    // Warm the whole group in the background so stepping never waits on the network.
    (this.props.list || []).forEach(src => { const im = new Image(); im.decoding = "async"; im.src = src; });
  }
  componentWillUnmount() { window.removeEventListener("keydown", this._key); }

  list() { return this.props.list || []; }
  index() {
    const n = this.list().length;
    const i = this.state.idx == null ? (this.props.start || 0) : this.state.idx;
    return n ? Math.min(Math.max(0, i), n - 1) : 0;
  }
  step(d) {
    const n = this.list().length;
    if (!n) return;
    this.setState({ idx: (this.index() + d + n) % n });
  }

  renderVals() {
    const list = this.list(), count = list.length, i = this.index();
    const w = count ? 100 / count : 100;
    const slides = list.map((src, n) => ({
      bg: Math.abs(n - i) <= 2 ? "url(" + src + ")" : "none",
      w: w + "%",
      dot: n === i ? "100%" : "0%",
      go: () => this.setState({ idx: n })
    }));
    return {
      slides,
      stripW: (count || 1) * 100 + "%",
      shift: "translateX(-" + (i * w) + "%)",
      counter: (i + 1) + " / " + count,
      groupName: this.props.groupName || "",
      caption: this.props.caption || "",
      onClose: () => this.props.onClose && this.props.onClose(),
      next: () => this.step(1),
      prev: () => this.step(-1),
      stop: e => { e.stopPropagation(); },
      // Drag is tracked on the instance, not in state — no re-render on pointer down.
      down: e => { this._x0 = e.clientX; },
      up: e => {
        if (this._x0 == null) return;
        const dx = e.clientX - this._x0; this._x0 = null;
        if (dx < -40) this.step(1); else if (dx > 40) this.step(-1);
      }
    };
  }
}
</script>
</body>
</html>
